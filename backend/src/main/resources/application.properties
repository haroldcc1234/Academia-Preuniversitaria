server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academia_jauja?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.demo=${APP_DEMO:true}
app.demo-full=${APP_DEMO_FULL:false}
app.admin-email=${ADMIN_EMAIL:director@academia.local}
app.admin-password=${ADMIN_PASSWORD:Director2026!}
app.cors=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.storage=${STORAGE_DRIVER:local}
app.files=${FILES_PATH:./private-files}
app.s3-endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3-bucket=${S3_BUCKET:academia}
app.s3-key=${S3_ACCESS_KEY:academia}
app.s3-secret=${S3_SECRET_KEY:academia_storage_2026}
app.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ollama-model=${OLLAMA_MODEL:qwen2.5:3b}
app.bulletin-model=${OLLAMA_BULLETIN_MODEL:qwen3-vl:2b}
app.bulletin-worker=${BULLETIN_WORKER:true}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:no-responder@academia.local}
server.error.include-message=always


# Only public bulletin questions are sent to Gemini; student assistance stays local.
app.bulletin-provider=${BULLETIN_AI_PROVIDER:ollama}
app.gemini-key=${GEMINI_API_KEY:}
app.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
app.gemini-interval-ms=${GEMINI_MIN_INTERVAL_MS:6500}
